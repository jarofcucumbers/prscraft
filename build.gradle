plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.0'
group = 'dev.jarofcucumbers.prscraft'
base { archivesName = 'prscraft' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.264'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { prscraft { sourceSet sourceSets.main } }
}
repositories { mavenCentral() }
dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
test { useJUnitPlatform() }

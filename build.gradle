plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.7.2'
group = 'dev.jarofcucumbers.prscraft'
base { archivesName = 'prscraft' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.264'
    runs {
        client { client() }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'prscraft' }
        server { server(); programArgument '--nogui' }
    }
    mods { prscraft { sourceSet sourceSets.main } }
}
repositories { mavenCentral() }
dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
test { useJUnitPlatform() }

// Test fixtures run from the development classpath, never from the shipped mod.
tasks.named('jar') { exclude '**/RadioGameTests*', 'data/prscraft/structure/empty.nbt' }

// Domain settings now contain nested NBT. Unit tests need Minecraft's actual NBT
// classes and their dependencies as well as our output; no game bootstrap is used.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
